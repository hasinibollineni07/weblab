<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Program 2</title>	
	<style>
		p{
			position:absolute;
			top:50%;
			left:50%;
			transform:translate(-50%,50%);
		}
	</style>
</head>
<body>
	<p id="demo"></p>
	<script>
		var font_size=5;
		var p=document.getElementById("demo");
		var is_growing=true;
		p.innerHTML="TEXT GROWING";
		p.style.color="red"
		var grow=setInterval(growing,100);
		function growing()
		{
			if(is_growing==true)
			{
				font_size+=1;
				if(font_size>=50)
				{
					is_growing=false;
					p.innerHTML="TEXT SHRINKING";
					p.style.color="blue"
				}
				p.style.fontSize=font_size+"px";
			}
			else
			{
				font_size-=1;
				if(font_size<=5)
				{
					clearInterval(grow);
					return;
				}
				p.style.fontSize=font_size+"px";
			}
		}
	</script>
</body>
</html>
